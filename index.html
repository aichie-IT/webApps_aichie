<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengembaraan Sains 3D</title>
<style>
:root{
  --ink:#19324a;--blue:#4f8cff;--cyan:#55d6ff;--green:#5ed48b;
  --yellow:#ffd45c;--pink:#ff7e9e;--panel:rgba(255,255,255,.92);
}
*{box-sizing:border-box} body{margin:0;overflow:hidden;font-family:Arial,sans-serif;color:var(--ink);background:#9de5ff}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;border:0;cursor:pointer}
#hud{position:fixed;inset:0;pointer-events:none}
.topbar{display:flex;gap:10px;align-items:center;padding:14px}
.badge{background:var(--panel);border:3px solid #fff;border-radius:18px;padding:9px 14px;box-shadow:0 5px 18px #27608a33;font-weight:800}
.progress{width:min(320px,34vw);height:15px;background:#d9e8f2;border-radius:99px;overflow:hidden;border:2px solid white}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5ed48b,#4f8cff);transition:.3s}
#menuBtn{margin-left:auto;pointer-events:auto;background:white;border-radius:14px;padding:10px 14px;font-weight:800}
#panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(850px,92vw);max-height:88vh;overflow:auto;background:var(--panel);border:4px solid white;border-radius:28px;padding:26px;box-shadow:0 25px 70px #183c5566;display:none;z-index:5}
#panel.show{display:block}
h1,h2{margin:5px 0 10px}.sub{opacity:.75;margin-bottom:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.card{background:#fff;border:3px solid #e4eef5;border-radius:20px;padding:17px;transition:.15s;box-shadow:0 8px 20px #234a6014}
.card.locked{opacity:.45;filter:grayscale(.7)} .card:not(.locked):hover{transform:translateY(-4px);border-color:#74b8ff}
.card button,.primary{background:linear-gradient(135deg,#4f8cff,#55cfff);color:#fff;border-radius:14px;padding:11px 15px;font-weight:800;margin-top:10px}
.secondary{background:#eaf2f7;border-radius:12px;padding:10px 14px;font-weight:700}
.close{float:right;background:#edf4f8;border-radius:50%;width:36px;height:36px;font-weight:900}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#17364d;color:#fff;padding:13px 19px;border-radius:15px;opacity:0;transition:.25s;z-index:20;font-weight:700}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#interaction{position:fixed;right:20px;bottom:20px;width:min(380px,calc(100vw - 40px));background:var(--panel);border:4px solid white;border-radius:24px;padding:18px;box-shadow:0 15px 40px #17364d33;display:none;z-index:4}
#interaction.show{display:block}
#choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{padding:11px;border-radius:12px;background:#eef5fa;font-weight:700}.choice:hover{background:#dceeff}
.dragzone{display:grid;grid-template-columns:1fr 1fr;gap:10px}.drop{min-height:60px;border:3px dashed #9bb7c9;border-radius:14px;padding:10px;background:#f7fbfd}.item{padding:10px;background:#fff;border-radius:10px;margin:6px 0;cursor:grab;border:2px solid #dce8ef;font-weight:700}
#start{position:fixed;inset:0;background:linear-gradient(#82dcff,#dff8ff);display:flex;align-items:center;justify-content:center;z-index:10}
.startbox{width:min(620px,90vw);text-align:center;background:#ffffffeb;padding:38px;border-radius:32px;border:5px solid #fff;box-shadow:0 30px 80px #1a527744}
.starticon{font-size:80px}.startbox button{background:linear-gradient(135deg,#4f8cff,#5ed48b);color:#fff;padding:15px 28px;border-radius:17px;font-size:20px;font-weight:900}
.legend{font-size:13px;opacity:.7;margin-top:8px}
#levelTitle{position:fixed;left:50%;top:17px;transform:translateX(-50%);background:#ffffffdc;padding:9px 17px;border-radius:16px;font-weight:900;z-index:2;pointer-events:none}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="start">
  <div class="startbox">
    <div class="starticon">🧑‍🔬🌱</div>
    <h1>Pengembaraan Sains 3D</h1>
    <p>Terokai dunia sains, selesaikan misi dan buka kawasan baharu!</p>
    <button id="startBtn">Mula Pengembaraan 🚀</button>
    <div class="legend">WASD / Arrow = bergerak · E = berinteraksi · M = peta</div>
  </div>
</div>

<div id="levelTitle">🌍 Peta Pengembaraan</div>
<div id="hud">
  <div class="topbar">
    <div class="badge">⭐ <span id="score">0</span></div>
    <div class="badge">🏆 <span id="stars">0</span></div>
    <div class="badge">Level <span id="level">1</span>/6</div>
    <div class="progress"><i id="bar"></i></div>
    <button id="menuBtn">🗺️ Peta</button>
  </div>
</div>

<div id="panel">
  <button class="close" onclick="closePanel()">×</button>
  <h2>🗺️ Peta Dunia Sains</h2>
  <div class="sub">Pilih kawasan yang telah dibuka. Lengkapkan misi untuk membuka level seterusnya.</div>
  <div id="cards" class="cards"></div>
</div>

<div id="interaction">
  <h3 id="missionTitle"></h3>
  <div id="missionText" class="sub"></div>
  <div id="missionBody"></div>
</div>
<div id="toast"></div>

<script>
"use strict";

/* =========================
   DATA PERMAINAN
========================= */
const levels=[
 {name:"Taman Tumbuhan",icon:"🌱",color:"#5ed48b",desc:"Kenali bahagian tumbuhan dan fungsi asasnya.",
  mission:"Bahagian tumbuhan",question:"Bahagian manakah menyerap air dan mineral dari tanah?",
  choices:["Akar","Bunga","Buah","Daun"],answer:0},
 {name:"Makmal Haiwan",icon:"🦋",color:"#ffb85c",desc:"Kenali ciri dan pengelasan haiwan.",
  mission:"Pengelasan haiwan",question:"Haiwan manakah merupakan mamalia?",
  choices:["Ikan emas","Kucing","Katak","Rama-rama"],answer:1},
 {name:"Makmal Bahan",icon:"🧪",color:"#a984ff",desc:"Terokai sifat pepejal, cecair dan gas.",
  mission:"Sifat bahan",question:"Apakah keadaan jirim bagi air yang membeku?",
  choices:["Gas","Cecair","Pepejal","Plasma"],answer:2},
 {name:"Lembah Tenaga",icon:"⚡",color:"#ffd45c",desc:"Eksperimen dengan sumber dan bentuk tenaga.",
  mission:"Sumber tenaga",question:"Antara berikut, yang manakah sumber tenaga boleh diperbaharui?",
  choices:["Arang batu","Petroleum","Matahari","Gas asli"],answer:2},
 {name:"Kitaran Air",icon:"💧",color:"#55cfff",desc:"Susun proses utama kitaran air mengikut urutan.",
  mission:"Sequence: kitaran air",sequence:["Penyejatan","Pemeluwapan","Hujan","Pengumpulan"]},
 {name:"Misi Angkasa",icon:"🚀",color:"#6877ff",desc:"Uji pengetahuan tentang sistem suria.",
  mission:"Sistem suria",question:"Planet manakah paling hampir dengan Matahari?",
  choices:["Bumi","Marikh","Zuhrah","Utarid"],answer:3}
];

let state={score:0,stars:0,unlocked:1,completed:[],level:0};
let running=false, keys={}, last=0, interactCooldown=0;
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
let W,H,dpr=1;
let player={x:0,z:0,y:0,angle:0,speed:5};
let camera={x:0,z:0};
let world={nodes:[],decor:[]};

function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",resize);resize();

/* =========================
   INPUT
========================= */
addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key.toLowerCase()))e.preventDefault();
 if(e.key.toLowerCase()==="m")openMap();
 if(e.key.toLowerCase()==="e")tryInteract();
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
document.getElementById("menuBtn").onclick=openMap;
document.getElementById("startBtn").onclick=()=>{document.getElementById("start").style.display="none";running=true;loadLevel(0);};

function toast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.classList.remove("show"),2200)}
function updateHUD(){
 document.getElementById("score").textContent=state.score;
 document.getElementById("stars").textContent=state.stars;
 document.getElementById("level").textContent=state.unlocked;
 document.getElementById("bar").style.width=(state.completed.length/levels.length*100)+"%";
}
function openMap(){
 const cards=document.getElementById("cards");cards.innerHTML="";
 levels.forEach((l,i)=>{
   const ok=i<state.unlocked;
   const done=state.completed.includes(i);
   const c=document.createElement("div");c.className="card"+(ok?"":" locked");
   c.innerHTML=`<div style="font-size:38px">${l.icon}</div><h3>Level ${i+1}: ${l.name}</h3><p>${l.desc}</p>
   <small>${done?"✅ Selesai":ok?"🔓 Terbuka":"🔒 Terkunci"}</small><br>
   <button ${ok?"":"disabled"}>${done?"Main Semula":"Masuk Level"}</button>`;
   c.querySelector("button").onclick=()=>{closePanel();loadLevel(i)};
   cards.appendChild(c);
 });
 document.getElementById("panel").classList.add("show");
}
function closePanel(){document.getElementById("panel").classList.remove("show")}

/* =========================
   WORLD / LEVEL
========================= */
function loadLevel(i){
 if(i>=state.unlocked){toast("Level ini masih terkunci 🔒");return}
 state.level=i; player.x=0;player.z=0; camera.x=0;camera.z=0;
 world.nodes=[];world.decor=[];
 const theme=levels[i];
 document.getElementById("levelTitle").textContent=`${theme.icon} Level ${i+1}: ${theme.name}`;
 buildWorld(i); updateHUD();
}
function buildWorld(i){
 // laluan utama + portal misi
 world.nodes=[
   {x:0,z:0,type:"start",label:"Pangkalan"},
   {x:0,z:-16,type:"mission",label:"Misi Sains",active:true},
   {x:15,z:-10,type:"tree",label:"Pokok"},
   {x:-15,z:-9,type:"rock",label:"Batu"},
   {x:18,z:8,type:"tree",label:"Pokok"},
   {x:-17,z:9,type:"rock",label:"Batu"}
 ];
 if(i===4) world.nodes.push({x:12,z:-5,type:"water",label:"Tasik"});
 for(let x=-24;x<=24;x+=8)for(let z=-20;z<=20;z+=8){
   if(Math.abs(x)<7&&Math.abs(z)<6)continue;
   world.decor.push({x:x+(Math.random()*3-1.5),z:z+(Math.random()*3-1.5),type:Math.random()<.6?"tree":"flower"});
 }
}

/* =========================
   MINI 3D ENGINE - PROJECTION
========================= */
function project(x,y,z){
 const rx=x-camera.x, rz=z-camera.z;
 const focal=Math.min(W,H)*.82;
 const depth=rz+18;
 if(depth<1)return null;
 return {x:W/2+rx*focal/depth,y:H*.53-y*focal/depth-depth*.18,s:focal/depth};
}
function drawSky(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#77d9ff");g.addColorStop(1,"#e8fbff");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // awan
 for(let i=0;i<5;i++){let x=(i*240-(camera.x*4%1200)+1200)%1200-100,y=85+(i%2)*60;ctx.fillStyle="#ffffffaa";ctx.beginPath();ctx.arc(x,y,28,0,7);ctx.arc(x+35,y-8,36,0,7);ctx.arc(x+75,y,25,0,7);ctx.fill()}
}
function drawGround(){
 ctx.fillStyle="#73c96f";
 ctx.beginPath();ctx.moveTo(0,H*.52);ctx.lineTo(W,H*.52);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
 // perspective tiles
 ctx.lineWidth=1;ctx.strokeStyle="#ffffff26";
 for(let z=-5;z<80;z+=5){
   const a=project(-50,0,z),b=project(50,0,z);if(a&&b){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
 }
 for(let x=-50;x<=50;x+=5){
   const a=project(x,0,-5),b=project(x,0,70);if(a&&b){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
 }
}
function shadow(p,rx,ry){
 if(!p)return;ctx.fillStyle="#18364a25";ctx.beginPath();ctx.ellipse(p.x,p.y+4*p.s,rx*p.s,ry*p.s,0,0,7);ctx.fill();
}
function tree(n){
 const p=project(n.x,0,n.z);if(!p)return;shadow(p,15,6);
 ctx.fillStyle="#9b633b";ctx.fillRect(p.x-5*p.s,p.y-42*p.s,10*p.s,42*p.s);
 ctx.fillStyle="#43ad62";ctx.beginPath();ctx.arc(p.x,p.y-54*p.s,25*p.s,0,7);ctx.arc(p.x-20*p.s,p.y-44*p.s,19*p.s,0,7);ctx.arc(p.x+20*p.s,p.y-43*p.s,18*p.s,0,7);ctx.fill();
}
function rock(n){
 const p=project(n.x,0,n.z);if(!p)return;shadow(p,17,7);
 ctx.fillStyle="#8ca0ad";ctx.beginPath();ctx.moveTo(p.x-20*p.s,p.y);ctx.lineTo(p.x-12*p.s,p.y-24*p.s);ctx.lineTo(p.x+8*p.s,p.y-31*p.s);ctx.lineTo(p.x+22*p.s,p.y-12*p.s);ctx.lineTo(p.x+16*p.s,p.y);ctx.closePath();ctx.fill();
}
function flower(n){
 const p=project(n.x,0,n.z);if(!p)return;
 ctx.strokeStyle="#3f9e56";ctx.lineWidth=2*p.s;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x,p.y-16*p.s);ctx.stroke();
 ctx.fillStyle="#ff7e9e";ctx.beginPath();ctx.arc(p.x,p.y-18*p.s,5*p.s,0,7);ctx.fill();
}
function water(n){
 const p=project(n.x,0,n.z);if(!p)return;
 ctx.fillStyle="#56c8edaa";ctx.beginPath();ctx.ellipse(p.x,p.y,45*p.s,18*p.s,0,0,7);ctx.fill();
}
function portal(n){
 const p=project(n.x,0,n.z);if(!p)return;shadow(p,25,8);
 ctx.save();ctx.translate(p.x,p.y-55*p.s);ctx.scale(p.s,p.s);
 ctx.strokeStyle=levels[state.level].color;ctx.lineWidth=7;ctx.beginPath();ctx.arc(0,0,28,-Math.PI,0);ctx.stroke();
 ctx.fillStyle="#ffffffaa";ctx.beginPath();ctx.arc(0,0,21,-Math.PI,0);ctx.fill();
 ctx.restore();
 ctx.fillStyle="#17364d";ctx.textAlign="center";ctx.font=`800 ${Math.max(10,14*p.s)}px Arial`;ctx.fillText(n.label,p.x,p.y+18*p.s);
}
function drawPlayer(){
 const p=project(player.x,0,player.z);if(!p)return;shadow(p,16,7);
 ctx.save();ctx.translate(p.x,p.y-47*p.s);ctx.scale(p.s,p.s);
 // badan
 ctx.fillStyle="#4f8cff";ctx.beginPath();ctx.roundRect(-14,-3,28,32,9);ctx.fill();
 // kepala
 ctx.fillStyle="#ffd0a6";ctx.beginPath();ctx.arc(0,-18,15,0,7);ctx.fill();
 // rambut
 ctx.fillStyle="#513b35";ctx.beginPath();ctx.arc(0,-25,15,Math.PI,0);ctx.fill();
 // mata
 ctx.fillStyle="#19324a";ctx.beginPath();ctx.arc(-5,-18,2,0,7);ctx.arc(5,-18,2,0,7);ctx.fill();
 // beg
 ctx.fillStyle="#ffb84d";ctx.fillRect(10,3,8,18);
 ctx.restore();
}
function drawWorld(){
 drawSky();drawGround();
 const arr=[...world.decor.map(n=>({...n})),...world.nodes.map(n=>({...n}))];
 arr.sort((a,b)=>b.z-a.z);
 arr.forEach(n=>{
   if(n.type==="tree")tree(n);else if(n.type==="rock")rock(n);else if(n.type==="flower")flower(n);else if(n.type==="water")water(n);else if(n.type==="mission"||n.type==="start")portal(n);
 });
 drawPlayer();
 // compass
 ctx.fillStyle="#ffffffdd";ctx.roundRect(18,H-75,160,46,13);ctx.fill();
 ctx.fillStyle="#17364d";ctx.font="700 13px Arial";ctx.fillText("WASD / ↑↓←→  bergerak",30,H-47);
}
function update(dt){
 let dx=0,dz=0;
 if(keys.w||keys.arrowup)dz-=1;if(keys.s||keys.arrowdown)dz+=1;
 if(keys.a||keys.arrowleft)dx-=1;if(keys.d||keys.arrowright)dx+=1;
 if(dx||dz){const l=Math.hypot(dx,dz);dx/=l;dz/=l;player.x+=dx*player.speed*dt;player.z+=dz*player.speed*dt;player.angle=Math.atan2(dx,dz)}
 player.x=Math.max(-27,Math.min(27,player.x));player.z=Math.max(-23,Math.min(30,player.z));
 camera.x+=(player.x-camera.x)*Math.min(1,dt*4);
 camera.z+=(player.z-camera.z)*Math.min(1,dt*4);
 if(interactCooldown>0)interactCooldown-=dt;
}
function loop(t){
 const dt=Math.min(.05,(t-last)/1000||0);last=t;
 if(running){update(dt);drawWorld();}else{drawSky();drawGround();}
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* =========================
   INTERAKSI / MINI GAMES
========================= */
function tryInteract(){
 if(interactCooldown>0)return;
 let nearest=null,dist=999;
 world.nodes.filter(n=>n.type==="mission").forEach(n=>{let d=Math.hypot(player.x-n.x,player.z-n.z);if(d<dist){dist=d;nearest=n}});
 if(nearest&&dist<6){interactCooldown=1;openMission();}
 else toast("Dekati portal misi bercahaya untuk berinteraksi ✨");
}
function openMission(){
 const l=levels[state.level];
 document.getElementById("missionTitle").textContent=`${l.icon} ${l.mission}`;
 document.getElementById("missionText").textContent=l.desc;
 const body=document.getElementById("missionBody");body.innerHTML="";
 if(l.sequence)makeSequence(body,l);else makeQuiz(body,l);
 document.getElementById("interaction").classList.add("show");
}
function closeMission(){document.getElementById("interaction").classList.remove("show")}
function makeQuiz(body,l){
 body.innerHTML=`<p><b>${l.question}</b></p><div id="choices"></div>`;
 const ch=body.querySelector("#choices");
 l.choices.forEach((x,i)=>{const b=document.createElement("button");b.className="choice";b.textContent=x;b.onclick=()=>answer(i===l.answer);ch.appendChild(b)});
}
function answer(ok){
 if(ok){state.score+=100;state.stars++;completeLevel();toast("Betul! +100 mata ⭐");}
 else {state.score=Math.max(0,state.score-20);toast("Belum tepat. Cuba lagi! 💡");}
 updateHUD();
}
function makeSequence(body,l){
 body.innerHTML=`<p><b>Seret langkah untuk menyusun proses daripada awal hingga akhir.</b></p>
 <div class="dragzone"><div id="items"></div><div id="drop" class="drop">Letak urutan di sini 👇</div></div>
 <button class="primary" id="checkSeq">Semak Urutan</button>`;
 const items=body.querySelector("#items"),drop=body.querySelector("#drop");
 [...l.sequence].sort(()=>Math.random()-.5).forEach(text=>{
   const d=document.createElement("div");d.className="item";d.textContent=text;d.draggable=true;
   d.ondragstart=e=>e.dataTransfer.setData("text/plain",text);items.appendChild(d);
 });
 drop.ondragover=e=>e.preventDefault();
 drop.ondrop=e=>{e.preventDefault();const text=e.dataTransfer.getData("text/plain");const el=[...items.children].find(x=>x.textContent===text);if(el){drop.appendChild(el);el.draggable=false}};
 body.querySelector("#checkSeq").onclick=()=>{
   const got=[...drop.children].map(x=>x.textContent);
   if(JSON.stringify(got)===JSON.stringify(l.sequence)){state.score+=150;state.stars++;completeLevel();toast("Urutan tepat! +150 mata 💧");}
   else toast("Urutan belum betul. Cuba susun semula! 🔄");
   updateHUD();
 };
}
function completeLevel(){
 if(!state.completed.includes(state.level))state.completed.push(state.level);
 if(state.level+1<levels.length && state.unlocked<state.level+2){
   state.unlocked=state.level+2;
   toast(`Level ${state.unlocked} dibuka! 🎉`);
 }
 updateHUD();setTimeout(closeMission,700);
}

/* klik canvas = gerak ringkas untuk desktop tanpa keyboard */
canvas.addEventListener("click",e=>{
 if(!running)return;
 const rect=canvas.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;
 // Jika klik dekat bahagian kanan bawah, anggap sebagai interaksi.
 if(mx>W*.75&&my>H*.72){tryInteract();return}
 // world-space anggaran berdasarkan kedudukan skrin
 const wx=camera.x+(mx-W/2)/Math.min(W,H)*18;
 const wz=camera.z+(my-H*.53)/Math.min(W,H)*18;
 player.x+=(wx-player.x)*.25;player.z+=(wz-player.z)*.25;
});

updateHUD();
</script>
</body>
</html>
